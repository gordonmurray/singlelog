name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"
      - name: fmt
        run: terraform fmt -check -recursive
      # -lockfile=readonly so a lock file that does not match the config fails
      # here, rather than being quietly repaired and passing.
      - name: init
        run: terraform init -backend=false -lockfile=readonly
      - name: validate
        run: terraform validate

  terraform-test:
    name: terraform-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      # terraform test evaluates file(), which terraform validate does not, so
      # the key referenced by ssh_public_key_path has to exist.
      - name: Throwaway key for the plan
        run: |
          mkdir -p tests/fixtures
          ssh-keygen -t ed25519 -N "" -C ci -f tests/fixtures/id_rsa
      - name: init
        run: terraform init -backend=false -lockfile=readonly
      # The providers are mocked, so this runs a plan with no AWS credentials.
      - name: test
        run: terraform test

  packer:
    name: packer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-packer@v3
        with:
          version: "1.11.2"
      - name: fmt
        run: packer fmt -check -recursive .
        working-directory: packer
      # No credentials needed: validate does not evaluate the data sources, so
      # it never calls AWS.
      - name: init and validate
        run: |
          for template in *.pkr.hcl; do
            packer init "$template"
            packer validate "$template"
          done
        working-directory: packer

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-linters/setup-tflint@v6
      - name: init
        run: tflint --init --config="$PWD/.tflint.hcl"
      - name: lint
        run: tflint --config="$PWD/.tflint.hcl" -f compact

  trivy-config:
    name: trivy-config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Scan Terraform with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivyignores: .trivyignore
          format: sarif
          output: trivy-results.sarif
      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
